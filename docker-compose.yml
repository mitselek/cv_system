services:
  edgedb:
    image: edgedb/edgedb:5
    environment:
      EDGEDB_SERVER_SECURITY: insecure_dev_mode
      EDGEDB_SERVER_TLS_CERT_MODE: generate_self_signed
    ports:
      - "5656:5656"
    volumes:
      - edgedb-data:/var/lib/edgedb/data
      - ./dbschema:/dbschema:ro
    healthcheck:
      test: ["CMD", "edgedb", "query", "--host", "localhost", "--port", "5656", "--user", "edgedb", "--tls-security=insecure", "SELECT 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  edgedb-data:
